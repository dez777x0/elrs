name: Web Flasher

on:
  push:
    paths:
      - 'web-flasher/**'
      - '.github/workflows/web-flasher.yml'
  pull_request:
    paths:
      - 'web-flasher/**'
      - '.github/workflows/web-flasher.yml'

jobs:
  web-flasher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-flasher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-flasher/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (vue-tsc)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
